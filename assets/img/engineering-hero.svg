<svg xmlns="http://www.w3.org/2000/svg" width="940" height="920" viewBox="0 0 940 920" fill="none" role="img" aria-labelledby="art-title art-description">
<title id="art-title">Аксонометрический чертёж сантехнического узла</title>
<desc id="art-description">Изометрическая система водопроводных труб, смесителя и раковины на инженерной сетке.</desc>
